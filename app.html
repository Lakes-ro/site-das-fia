<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Espaço</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
</head>
<body>
  <!-- Top Navigation -->
  <nav class="top-nav" data-testid="main-navigation">
    <div class="nav-brand">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2"/>
        <path d="M32 12v40M20 32h24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span id="navUsername">Carregando...</span>
    </div>
    <div class="nav-actions">
      <button id="navNotifications" class="icon-btn" data-testid="notifications-btn" title="Notificações">
        <span class="notification-badge" style="display: none;">0</span>
        🔔
      </button>
      <button id="navSettings" class="icon-btn" data-testid="settings-btn" title="Personalizar Tema">⚙️</button>
      <button id="navLogout" class="icon-btn" data-testid="logout-btn" title="Sair">🚪</button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" data-testid="sidebar">
      <div class="sidebar-menu">
        <a href="#" data-view="my-space" class="menu-item active" data-testid="my-space-link">
          <span class="icon">📔</span>
          <span>Meu Diário</span>
        </a>
        <a href="#" data-view="feed" class="menu-item" data-testid="feed-link">
          <span class="icon">🌟</span>
          <span>6º Espaço</span>
        </a>
        <a href="#" data-view="chat" class="menu-item" id="chatMenuItem" data-testid="chat-link">
          <span class="icon">💬</span>
          <span id="chatMenuLabel">Chat</span>
          <span class="unread-badge" style="display: none;">0</span>
        </a>
        <div id="adminMenu" style="display: none;">
          <a href="#" data-view="admin" class="menu-item" data-testid="admin-link">
            <span class="icon">👑</span>
            <span>Painel do Pai</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">

      <!-- View: Meu Diário -->
      <div id="mySpaceView" class="view active" data-testid="my-space-view">
        <header class="view-header">
          <h1>Meu Diário Privado</h1>
          <button id="btnNewEntry" class="btn-primary" data-testid="new-entry-btn">✏️ Nova Entrada</button>
        </header>
        <div id="myEntriesList" class="entries-grid" data-testid="my-entries-list"></div>
      </div>

      <!-- View: Feed -->
      <div id="feedView" class="view" data-testid="feed-view">
        <header class="view-header">
          <h1>6º Espaço — Feed da Família</h1>
          <button id="btnShareEntry" class="btn-primary" data-testid="share-entry-btn">📤 Compartilhar</button>
        </header>
        <div id="feedList" class="entries-grid" data-testid="feed-list"></div>
      </div>

      <!-- View: Chat -->
      <div id="chatView" class="view" data-testid="chat-view">
        <div class="chat-layout">
          <!-- Painel de contatos: visível apenas para o pai -->
          <div class="chat-contacts-panel" id="chatContactsPanel" style="display: none;">
            <div class="chat-contacts-header">
              <h2>Conversas</h2>
            </div>
            <div id="chatContactList" class="chat-contact-list"></div>
          </div>

          <!-- Painel de mensagens -->
          <div class="chat-messages-panel">
            <header class="view-header" style="padding: 1.5rem 1.5rem 0;">
              <h1 id="chatTitle">Chat</h1>
            </header>
            <div class="chat-container">
              <div id="chatMessages" class="chat-messages" data-testid="chat-messages"></div>
              <form id="chatForm" class="chat-input-form">
                <input type="text" id="chatInput" placeholder="Escreva sua mensagem..." required data-testid="chat-input" autocomplete="off">
                <button type="submit" class="btn-primary" data-testid="chat-send-btn">Enviar</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- View: Painel do Pai -->
      <div id="adminView" class="view" data-testid="admin-view">
        <header class="view-header">
          <h1>👑 Painel do Pai</h1>
        </header>
        <div class="admin-content">
          <div class="admin-section">
            <h2>Membros da Família</h2>
            <div id="familyMembersList" data-testid="family-members-list"></div>
          </div>
          <div class="admin-section">
            <h2>Todas as Entradas</h2>
            <div id="allEntriesList" data-testid="all-entries-list"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Modal: Nova/Editar Entrada -->
  <div id="entryModal" class="modal" data-testid="entry-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="entryModalTitle">Nova Entrada</h2>
        <button class="modal-close" data-testid="modal-close-btn">✕</button>
      </div>
      <form id="entryForm">
        <div class="form-group">
          <label for="entryContent">Conteúdo</label>
          <textarea id="entryContent" rows="8" required placeholder="Escreva seus pensamentos..." data-testid="entry-content-input"></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="entryIsShared" data-testid="entry-share-checkbox">
            Compartilhar no 6º Espaço
          </label>
        </div>
        <div class="form-group">
          <label for="entryMedia">Adicionar Imagem/Vídeo</label>
          <input type="file" id="entryMedia" accept="image/*,video/*" data-testid="entry-media-input">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btnCancelEntry" data-testid="cancel-entry-btn">Cancelar</button>
          <button type="submit" class="btn-primary" data-testid="save-entry-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Personalizar Tema -->
  <div id="themeModal" class="modal" data-testid="theme-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Personalizar Tema</h2>
        <button class="modal-close" data-testid="theme-modal-close-btn">✕</button>
      </div>
      <div class="theme-customizer">
        <div class="form-group">
          <label for="primaryColor">Cor Principal</label>
          <input type="color" id="primaryColor" data-testid="primary-color-input">
        </div>
        <div class="form-group">
          <label for="bgColor">Cor de Fundo</label>
          <input type="color" id="bgColor" data-testid="bg-color-input">
        </div>
        <div class="form-group">
          <label for="textColor">Cor do Texto</label>
          <input type="color" id="textColor" data-testid="text-color-input">
        </div>
        <div class="form-group">
          <label for="fontFamily">Fonte</label>
          <select id="fontFamily" data-testid="font-family-select">
            <option value="Inter">Inter</option>
            <option value="Georgia">Georgia</option>
            <option value="Courier New">Courier New</option>
            <option value="Arial">Arial</option>
            <option value="Verdana">Verdana</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btnResetTheme" data-testid="reset-theme-btn">Resetar</button>
          <button type="button" class="btn-primary" id="btnSaveTheme" data-testid="save-theme-btn">Salvar Tema</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ORDEM DOS SCRIPTS IMPORTA -->
  <script src="config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="theme.js"></script>
  <script src="diary.js"></script>
  <script src="feed.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
